for(const[x,z]of[[.5,16.5],[59.5,16.5],[.5,25.5],[59.5,25.5],[20.5,25.5],[39.5,25.5]])bx(scene,1.9,15,1.3,x<1?x+.45:x>59?x-.45:x,GH+7.5,z,white);
